name: Calidad SIGC-GAS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Analizar y compilar frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Analizar calidad del codigo
        run: npm run lint

      - name: Compilar frontend
        run: npm run build

  backend:
    name: Analizar backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Analizar calidad del codigo
        run: npm run lint

  selenium:
    name: Ejecutar pruebas Selenium
    runs-on: ubuntu-latest

    needs:
      - frontend
      - backend

    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      MONGO_URI: mongodb://127.0.0.1:27017/sigc_gas_test
      JWT_SECRET: "sigc-gas-ci-test-secret-2026"
      PORT: "5000"
      CI: "true"

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            pruebas-selenium/package-lock.json

      - name: Instalar dependencias del backend
        run: npm --prefix backend ci

      - name: Instalar dependencias del frontend
        run: npm --prefix frontend ci

      - name: Instalar dependencias de Selenium
        run: npm --prefix pruebas-selenium ci

      - name: Preparar datos de prueba
        run: npm --prefix backend run seed:test

      - name: Iniciar sistema y ejecutar pruebas
        run: |
          npm --prefix backend start > backend.log 2>&1 &
          BACKEND_PID=$!

          npm --prefix frontend run dev -- --host 127.0.0.1 > frontend.log 2>&1 &
          FRONTEND_PID=$!

          limpiar_procesos() {
            kill "$BACKEND_PID" "$FRONTEND_PID" 2>/dev/null || true
          }

          trap limpiar_procesos EXIT

          for intento in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/ > /dev/null; then
              echo "Backend listo."
              break
            fi

            if [ "$intento" -eq 30 ]; then
              echo "El backend no inicio a tiempo."
              cat backend.log
              exit 1
            fi

            sleep 2
          done
          echo "Ejecutando pruebas de seguridad de la API."
          npm --prefix backend run test:security-api

          echo "Ejecutando pruebas de validacion de la API."
          npm --prefix backend run test:validation-api

          echo "Ejecutando pruebas de reglas de negocio de la API."
          npm --prefix backend run test:business-rules-api

          for intento in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then
              echo "Frontend listo."
              break
            fi

            if [ "$intento" -eq 30 ]; then
              echo "El frontend no inicio a tiempo."
              cat frontend.log
              exit 1
            fi

            sleep 2
          done

          npm --prefix pruebas-selenium test

      - name: Guardar evidencias y registros
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidencias-selenium
          path: |
            pruebas-selenium/evidencias/
            backend.log
            frontend.log
          if-no-files-found: warn
          retention-days: 14